server:
  port: 8080

spring:
  application:
    name: DidiCampus
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/didi_campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: didi123456
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6380

didicampus:
  node-id: 1
  cache:
    mode: redis
    logical-ttl-ms: 300000
    empty-ttl-ms: 60000
    double-delete-enabled: true
    double-delete-ms: 500
    redisson-pool-size: 16
    redis:
      shards: 4
      ttl-seconds: 600
      jitter-seconds: 120
      empty-ttl-seconds: 60
      bloom-enabled: true
  grab:
    slot-mode: redis
    queue-mode: redis
    limit-mode: sentinel
    limit-enabled: true
    limit-per-second: 500
    limit-resource: didicampus-grab
  credit:
    min-score: 40
    max-ongoing: 5
    ranking-mode: redis
  timeout:
    confirm-seconds: 300
    max-transfer-rounds: 5
  settle:
    commission-rate: 0.05
  auth:
    # Redis JWT 让 refresh token、吊销黑名单可以跨应用实例共享。
    mode: redis-jwt
    jwt-secret: didi-campus-local-demo-secret-key-min-32-bytes
    arbitrator-id: 9001
    access-token-minutes: 120
    refresh-token-minutes: 10080
    allow-header-identity: false
  web:
    cors-origins: http://localhost:5173
  mq:
    enabled: true
    endpoints: 127.0.0.1:8081
    topic:
      confirm-timeout: errand-confirm-timeout
      auto-settle: errand-auto-settle
      fund-event: errand-fund-event
    group:
      confirm-timeout: didicampus-timeout-consumer
      auto-settle: didicampus-auto-settle-consumer
      fund-event: didicampus-fund-event-consumer
      cache-evict: didicampus-cache-evict-consumer
  ws:
    enabled: true
