spring:
  application:
    name: DidiCampusWorker
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/didi_campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: didi123456
  data:
    redis:
      host: 127.0.0.1
      port: 6380

didicampus:
  node-id: 2
  mq:
    enabled: true
    endpoints: 127.0.0.1:8081
    topic:
      confirm-timeout: errand-confirm-timeout
      auto-settle: errand-auto-settle
      fund-event: errand-fund-event
    group:
      confirm-timeout: didicampus-timeout-consumer
      auto-settle: didicampus-auto-settle-consumer
      fund-event: didicampus-fund-event-consumer
      cache-evict: didicampus-cache-evict-consumer
  ws:
    enabled: false
  cache:
    mode: redis
    double-delete-enabled: true
  grab:
    slot-mode: redis
    queue-mode: redis
    limit-mode: sentinel
  credit:
    ranking-mode: redis
  worker:
    local-message:
      interval-ms: 10000
      batch-size: 100
      max-retry: 6
    timeout:
      interval-ms: 5000
      grace-seconds: 2
      batch-size: 200
    settle:
      interval-ms: 5000
      auto-seconds: 86400
      batch-size: 200
    recon:
      cron: "0 0 2 * * ?"
    credit:
      cron: "0 0 3 * * ?"
      batch-size: 1000
    cache-check:
      interval-ms: 300000
  cache:
    check-sample-size: 100
